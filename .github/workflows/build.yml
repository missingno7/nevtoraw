name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-python
      - name: Build and run generated-fixture tests
        run: mingw32-make test
      - name: Package binary and matching source
        run: python tools/package_release.py
      - uses: actions/upload-artifact@v6
        with:
          name: nevtoraw-windows-x64
          path: out/release/*
          if-no-files-found: error
